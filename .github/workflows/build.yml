name: Build

# When it runs (decisions 0049, 0058):
# - pull requests, pushes to main, by hand: Debug and Release in parallel,
#   with a compiler cache, the tests as parallel processes and a short soak;
# - every night (main) and by hand with a length: the long soak, 4 hours of
#   simulated playing, with the Release app built as players get it (LTO).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  # Every pull request runs (main requires the "CI" check), but one that only
  # changes docs skips the Windows builds: see the "changes" job.
  pull_request:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Seconds of simulated playing for the soak test (14400 = a 4-hour show)
        default: '120'

# A newer run for the same branch or pull request replaces one still going.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The long soak at night; short everywhere else (or what was asked for).
  ENCORE_SOAK_SECONDS: ${{ github.event_name == 'schedule' && '14400' || inputs.soak_seconds || '120' }}
  # Each test process may take this long: with the short soak a hang fails in
  # 10 minutes (its log names the test that was running), not after hours. A
  # test group takes about a minute (Release) to three (Debug, 2-minute soak).
  ENCORE_TEST_TIMEOUT: ${{ (github.event_name == 'schedule' || (inputs.soak_seconds != '' && inputs.soak_seconds != '120')) && '7200' || '600' }}
  # Link-time optimisation only for the players' build: every night and when run
  # by hand. Pull requests and pushes to main build alike, so main's compiler
  # cache is the one every pull request reuses (LTO objects can't be reused
  # without LTO, so those runs keep their own cache).
  ENCORE_LTO: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'ON' || 'OFF' }}
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'

jobs:
  # Does this change touch anything that builds? A pull request that only
  # changes docs (*.md, docs/, LICENSE) needs no Windows build. Everything that
  # isn't a pull request builds.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > files.txt
          echo "Changed files:"; cat files.txt
          if grep -qvE '(\.md$|^docs/|^LICENSE)' files.txt; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Builds needed: $code"

  windows:
    name: Windows ${{ matrix.config }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Release
            targets: Encore EncoreTests
          - config: Debug
            targets: EncoreTests
    steps:
      - uses: actions/checkout@v4

      # Ninja + MSVC from the command line, as the CMake presets use.
      - name: Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The toolchain this runner has: GitHub changes runner images (and with
      # them the MSVC version) without notice, and during a rollout runners with
      # both run side by side. A cache made with another compiler is useless:
      # compiled objects miss, and JUCE's build helper fails to configure.
      - name: Toolchain (for the cache keys)
        shell: pwsh
        run: |
          echo "ENCORE_COMPILER=msvc$env:VCToolsVersion" >> $env:GITHUB_ENV
          echo "ENCORE_TOOLCHAIN=msvc$env:VCToolsVersion-image$env:ImageVersion" >> $env:GITHUB_ENV

      # Compiled objects are reused across runs: only what changed compiles.
      # sccache is the cache that works with MSVC (needs /Z7 debug info, set below).
      # One cache per compiler version (and for LTO), so a rollout costs one cold
      # run per version, not one each time a run lands on the other image.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-${{ matrix.config }}${{ env.ENCORE_LTO == 'ON' && '-lto' || '' }}-${{ env.ENCORE_COMPILER }}
          max-size: 2G

      # JUCE, NeuralAmpModelerCore and Eigen as downloaded (and JUCE's build
      # helper as built), per toolchain, configuration and generator.
      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-ninja-${{ runner.os }}-${{ env.ENCORE_TOOLCHAIN }}-${{ matrix.config }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-ninja-${{ runner.os }}-${{ env.ENCORE_TOOLCHAIN }}-${{ matrix.config }}-

      # ENCORE_PCH=OFF: sccache can't reuse files compiled against a precompiled
      # header, and the cache saves far more. It also proves every file
      # includes what it uses.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DENCORE_PCH=OFF -DENCORE_LTO=${{ env.ENCORE_LTO }}

      - name: Build (${{ matrix.config }})
        run: cmake --build build --target ${{ matrix.targets }}

      - name: Compiler cache statistics
        run: sccache --show-stats

      # Four test processes at once (robustness, plugins, screens, the rest).
      - name: Run the tests (soak ${{ env.ENCORE_SOAK_SECONDS }} s)
        run: ctest --test-dir build --output-on-failure --parallel 4 --timeout ${{ env.ENCORE_TEST_TIMEOUT }}

      - name: Upload Encore.exe
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Encore-windows-x64
          path: build/Encore_artefacts/Release/Encore.exe
          if-no-files-found: error

  # The one check main requires: green when the builds passed, or when the
  # change needed none (docs only). Required checks can't name matrix jobs
  # that were skipped, so this job stands for them.
  ci:
    name: CI
    needs: [changes, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "changes: ${{ needs.changes.result }}, builds: ${{ needs.windows.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          case "${{ needs.windows.result }}" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac

