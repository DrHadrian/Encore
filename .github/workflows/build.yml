name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows Release (app + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-release-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Run engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Encore.exe
        uses: actions/upload-artifact@v4
        with:
          name: Encore-windows-x64
          path: build/Encore_artefacts/Release/Encore.exe
          if-no-files-found: error

  windows-debug-tests:
    name: Windows Debug (tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-debug-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build tests (Debug)
        run: cmake --build build --config Debug --target EncoreTests --parallel

      - name: Run engine tests
        run: ctest --test-dir build -C Debug --output-on-failure
